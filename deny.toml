[graph]
targets = ["aarch64-apple-darwin"]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "fontdb parses only the bundled trusted font; replace when cosmic-text migrates" },
  { id = "RUSTSEC-2026-0253", reason = "glyphon uses Copy glyph keys and pop_lru, not pop with a panicking key destructor" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = ["Apache-2.0", "ISC", "MIT", "Unicode-3.0", "Zlib"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
