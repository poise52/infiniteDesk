name: CI
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build desktop manager bundle
        run: ./scripts/build-macos-app.sh
      - name: Run headless desktop adapter tests
        run: ./native/macos/Desktop/Tests/run.sh
      - name: Check desktop acceptance harness
        run: ./native/macos/Desktop/Acceptance/run.sh --check
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo install cargo-nextest --version 0.9.150 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo deny check
      - run: cargo audit
      - run: cargo build --workspace --release --locked
