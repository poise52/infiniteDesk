<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InfiniteDesk Chrome B</title>
<style>
body { font: 22px system-ui, sans-serif; margin: 0; padding: 28px 36px; min-height: 100vh; box-sizing: border-box; color: #18212a; background: #ffdfd4; border-top: 18px solid #842b13; }
h1 { margin: 0 0 18px; color: #a23823; font-size: 52px; }
label { display: block; margin: 24px 0; }
input { display: block; width: 28em; max-width: 90%; font: inherit; padding: 8px; }
output { overflow-wrap: anywhere; }
#changed { display: inline-block; padding: 10px 16px; background: #fff; border: 3px solid currentColor; font-weight: 800; }
</style>
</head>
<body>
<h1>Chrome window B</h1>
<p>Active field: <output id="active">none</output></p>
<label>Target text <input id="target" autofocus value="TARGET-B" autocomplete="off"></label>
<label>Neutral decoy <input id="decoy" value="DECOY-B" autocomplete="off"></label>
<p><output id="changed">TARGET NOT EDITED</output></p>
<p>DOM input events · Target: <output id="target-count">0</output> · Decoy: <output id="decoy-count">0</output></p>
<p>Target value: <output id="value"></output> · Decoy value: <output id="decoy-value"></output></p>
<p>Page visibility: <output id="visibility"></output>; page has focus: <output id="focus"></output></p>
<script>
const target = document.getElementById('target');
const decoy = document.getElementById('decoy');
const counts = { target: 0, decoy: 0 };
function refresh() {
  document.getElementById('value').textContent = target.value;
  document.getElementById('decoy-value').textContent = decoy.value;
  const active = document.activeElement;
  document.getElementById('active').textContent =
    active === target || active === decoy ? active.id : 'none';
  document.getElementById('visibility').textContent = document.visibilityState;
  document.getElementById('focus').textContent = String(document.hasFocus());
}
for (const field of [target, decoy]) {
  field.addEventListener('input', () => {
    counts[field.id] += 1;
    document.getElementById(field.id + '-count').textContent = String(counts[field.id]);
    if (field === target) document.getElementById('changed').textContent = 'TARGET EDITED';
    refresh();
  });
}
document.addEventListener('focusin', refresh);
document.addEventListener('focusout', refresh);
document.addEventListener('visibilitychange', refresh);
window.addEventListener('focus', refresh);
window.addEventListener('blur', refresh);
refresh();
</script>
</body>
</html>
